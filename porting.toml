[[area]]
id = "packaging"
status = "planned"
components = []
paths = [
  "scripts/*payload*",
  "scripts/*image*",
  "scripts/build-*",
  "patches/**",
  "package/Kit.toml",
]
inputs = [
  "XNU 10063.141.1 with the arm64 patch series and the iPadOS 17.7.11 userland.",
  "A payload ramdisk with the loader, the ADT, the device tree and the Data seed.",
  "An Android boot image the stock ABL accepts.",
]
configuration = [
  "payload.volume INSTNPDLP, loader firmware, title Boot; size_mib is 80 because boot_a measures 96 MiB and the image keeps 8 MiB of it free.",
  "payload.adt sets chip_id 0x164 for kona, owned_memory_size 0x100000000 and unique_chip_id required.",
  "patches/xnu/series is empty: kona needs no XNU patch beyond the arch, SoC and OS series.",
]
procedure = [
  "./unixnu build kernel, build package, build payload --unique-chip-id <hex> --trust-cache <bundle> --data-ramdisk <seed>, then bootimg --dtb <board.dtb>.",
]
findings = [
  "docs/porting/steps.md step 7 requires the kernel, package, firmware, payload and boot image in that order with each output checked before the next step.",
]
completion = [
  "Kernel and prelink succeed, the payload contains every declared input, and the boot image matches the bootloader format and size limit.",
]
limits = [
  "The kernel and payload cannot be built on this host: the toolchain requires Xcode or the Linux cross toolchain.",
  "The trust cache bundle, Data seed and unique chip id are not produced yet.",
]
next_action = [
  "Read the boot partition size and unique chip id over ADB, then build on a Linux or macOS host.",
]
evidence = []

