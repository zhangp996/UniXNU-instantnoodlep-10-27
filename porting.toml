findings = [
  "docs/guide/debugging.md documents the green-bar entry probe and the device-tree panic region as the two evidence channels before the kernel can draw.",
  "The documented kernel-to-panel transport on a board without a UART is the boot progress diagnostic page (docs/guide/debugging.md: boot-progress=1 freezes after a stall, 2 runs continuously; 48 rows of 120 columns, scale 3 above 2160x1400). Its renderer binds the frame buffer from vinfo.v_baseaddr and re-binds after console init, which is the same record scripts/xnu-panic-screen.c draws through and the reason PE_state.video (physical) and a fresh ml_io_map (10 MiB of kmem on this panel) both fail on this board.",
  "The layer's implementation is not part of the UniXNU revision this port builds: scripts/build-boot-progress.py and kits/sheng/BootProgress.c that the shared interlock and zzz-boot-progress.patch call are absent, while the interlock also demands the audited owner-root build and the Virtio transport. UniXNU-sheng at 08cde20 carries both files; BootProgress.c is vendored byte-identical into this repository's package directory with its Font.h, which tree.py assembles as kits/instantnoodlep, and scripts/build-boot-progress.py compiles the single object from there. Of the storage symbols it reads, native_ufs_block_reads, native_ufs_block_failures, native_ufs_integrity_failures and native_ufs_progress_text are defined by the KonaUfs component and the rest are weak imports, so nothing is stubbed. The interlock is relaxed to the source crypto provider, the deviation docs/devices/sirius.md records for sdm710.",
  "The first boot-progress build compiled the renderer and failed at the link: the kernel link does not honour weak_import, so every counter the renderer names has to exist, and the ones this board does not carry (Virtio transport, verified-block chain, Synaptics touch, legacy display, Adreno, sheng PMGR) were undefined. package/BootProgressStubs.c defines them weakly, generated from the extern declarations of BootProgress.c; a strong definition from a component still wins, so the KonaUfs counters keep reporting and the rows this board cannot fill show zero.",
]
