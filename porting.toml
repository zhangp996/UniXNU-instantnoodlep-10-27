schema_version = 1

[device]
name = "instantnoodlep"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "OnePlus 8 Pro (IN2020) bring-up: arm64 iPadOS 17 profile, configuration resolves; firmware platform, UFS, display and touch drivers are pending."

[[area]]
id = "configuration"
status = "host-verified"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "unixnu.lock", "configs/**", "dts/**", ".github/**", ".gitignore"]
inputs = ["Layered profiles: profiles/arch/arm64, UniXNU-sm8250-common/soc.toml (commit 3481a8bfd60fb9f8cefe5cfdf402b64c8b303b1e), profiles/os/ipados-17.7.11-21H461, then this board.toml.", "SoC facts from the board's own stock boot_a and dtbo_a images."]
configuration = ["board.soc = \"SM8250\"", "board.soc_source = \"sm8250\"", "board.os_profile = \"ipados-17.7.11-21H461\"", "kernel.defconfig = \"instantnoodlep_defconfig\"", "device_tree.source = \"device:dts/instantnoodlep.dts\""]
procedure = ["python3 ./unixnu defconfig instantnoodlep_defconfig -D ../UniXNU-instantnoodlep", "python3 ./unixnu status -D ../UniXNU-instantnoodlep"]
findings = ["The arm64 profile is correct for this board: SM8250 is Armv8.2-A and exposes no FEAT_PAuth, so arm64e does not apply.", "The SoC feed is the kona repository whose soc.toml records IN2020 stock boot_a and dtbo_a as its hardware source.", "The OS profile applies patches/xnu/zzz-boot-progress.patch, whose bsd_init.c hunk needs the XNU_SHENG_PMGR block inserted by patches/xnu/sheng-platform-power.patch; no series applied that patch, so the device applies a copy (00-pmgr-run-hook.patch) before the OS series. CONFIG_XNU_SHENG_PMGR is unset, so the block compiles out.", "kernel.archives is a replacing array: it repeats the complete profiles/arch/arm64 order (corecrypto twice, ArmDTPlatform, ArmCpu, SoftwareAES, the AES original bindings, the mockfs fixture, libpthread) and appends component:ShengUfs with VirtioMmioBlock and VerifiedRoot. Naming only the storage components drops the rest and the link fails on IOAESAccelerator. The resolved SoC repository is linked into the assembled tree as soc/ so a component that declares soc_headers can include its headers.", "unixnu.lock now records a pinned revision for ShengUfs; feeds.toml names it, and the local working trees for it and sm8250 are pinned in the Git-ignored local.toml."]
completion = ["Every source pin resolves and status lists the intended profile, components and patch order."]
limits = ["No UEFI firmware repository (uefi-instantnoodlep) exists yet, so the firmware, payload and boot-image inputs cannot be filled."]
next_action = ["Create or locate the Mu-Silicium platform for kona/instantnoodlep, then fill [firmware] and [bootimg]."]
evidence = [{ kind = "host", reference = "docs/evidence/2026-11-09-unixnu-status.log", command = "python3 ./unixnu defconfig instantnoodlep_defconfig -D ../UniXNU-instantnoodlep && python3 ./unixnu status -D ../UniXNU-instantnoodlep", result = "Resolved arch arm64, soc sm8250 at 3481a8bfd60f, os ipados-17.7.11-21H461 and 59 XNU patches; output out/instantnoodlep/ipados-17.7.11-21H461/instantnoodlep.", revision = "8ec13bb1077502e53e8ba3b82c56842589b5c837" }]

[[area]]
id = "firmware"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["board.toml", "docs/evidence/2026-11-09-device-menu.md", "docs/evidence/2026-11-09-kernel-handoff-probes.md", "docs/evidence/2026-11-09-xbl-dxe.md"]
inputs = ["Mu-Silicium platform package Platforms/OnePlus/instantnoodlepPkg (FD 0x9E400000, 4 MiB, SimpleFbDxe + KonaKeysDxe + PanicLogDxe).", "xbl_a DXE modules are not selected: the platform is source-built, per the working package."]
configuration = ["[firmware] config = instantnoodlep, dsc = Platforms/OnePlus/instantnoodlepPkg/instantnoodlep.dsc, fd = Build/instantnoodlepPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd.", "FD_BASE 0x9E400000, FD_SIZE 0x400000; frame buffer 1080x2376 (the panel timing ABL scans out).", "boot image hand-packed: header v2, shim image_size 0x400000, stock boot_a dtb, cmdline console=ttyMSM0,115200n8 androidboot.hardware=qcom."]
procedure = ["Build the platform package with the board overlay and the Silicium/edk2 alignment patches.", "clang -DFD_BASE=0x9E400000 -DFD_SIZE=0x400000 -DREQUIRES_KERNEL_HEADER=1 BootShim.S; cat shim.bin SILICIUM_UEFI.fd > kernel.bin; mkbootimg --header_version 2 --dtb stock.dtb.", "fastboot boot bootD.img"]
findings = ["The firmware reaches the UniXNU menu, counts down 60 seconds and accepts volume/power keys through KonaKeysDxe.", "The FD must sit at 0x9E400000: 0x9FC00000 overlaps kboot_uboot_logmem and never starts; image_size in the ARM64 header must stay FD_SIZE, not shim+FD.", "Entry-probe bars (blue = MMU-off kernel entry, magenta = before the MMU is enabled) appear on the panel, so the DarwinBoot hand-off and the early kernel entry run.", "Reset probes place the first kernel-side failure in PE_create_console: arm_vm_init and the KPRINTF startup entries return, console creation does not.", "Root cause: XNU's initialize_screen() maps the frame buffer only when bit 0 of the handed-off video base is set; DarwinBoot passed the raw GOP physical base 0x9C000000 (cont_splash_region), so XNU used it as a virtual address and faulted on the first console store.", "Setting Video[0] = FrameBufferBase | 1 in DarwinBootVideoFromGop() reaches the kernel and makes the panic screen draw: its first report was an alignment fault, because the entry probe painted its blue bar at 0x9C09C9F1 (video base + framebuffer/16 + 1) with the tag bit set while the MMU was off.", "scripts/patch-xnu-entry-probe.py now clears the low three bits of the video base before painting; with that fix the bars paint and the boot still stops about three seconds after them without console text.", "A reset probe on _initialize_screen inside _PE_initialize_console did not fire, but the reference port for this board warns that the probe's inline assembly is only valid before the pmap switch, so a silent probe after that point does not prove a fault there.", "The reference port (F:/UniXNU-instantnoodlep) records the same hand-off wall: PE_state.video.v_baseAddr is the physical base and faults at 0x9c00a8e0 when drawn through, ml_io_map of the panel panics in kmem_alloc with KERN_NO_SPACE for 10264576 bytes (round_page(1080x2376x4)), and its console draws through vinfo.v_baseaddr instead.", "board.toml carries the reference port's arguments for this board (-v serial=3 debug=0x14e -no_slto_panic amfi_get_out_of_my_way=1): its record says AMFI panics with No PMGR until a PMGR provider exists and the spinlock timeout panic has to be off before that work.", "The reference port also patches every kernel with scripts/patch-amfi-nopmgr.py; the call site matched this kernel (0x940069b8 -> 0x17ffffd2 at 0x198ad04) and scripts/patch-amfi-nopmgr.py is now part of this repository. bootP.img carries the patched kernel and still ends in 900E three bars later, so AMFI is not the stopping layer.", "The gap between the bars and 900E is the SoC watchdog after a parked panic, not progress: the fault is at or just after console creation, which is also why the panic screen stays blank (vinfo.v_baseaddr is what initialize_screen has not set yet).", "An A/B over six images (tagged/untagged video base x patched/unpatched AMFI) ends in the same three bars and 900E every time, so neither the tag nor AMFI moves the stopping point; what is left is the frame-buffer mapping that initialize_screen asks for.", "DarwinBoot now draws the hand-off facts straight into the frame buffer (kernel pa 0xC007C000, window 0x100000000, args 0xC4044000, video 0x9C000000, entry 0xC32144B8); the frame buffer is below the window, so neither the overlap hypothesis nor a short static window explains the wall.", "Root cause: io_map() takes its static branch while startup_phase < STARTUP_SUB_KMEM, but virtual_space_start is only assigned by pmap_startup() during the STARTUP_SUB_KMEM entries, which run after PE_create_console() in arm_init(). The mapping therefore returns 0, vinfo.v_baseaddr becomes 0 and the first console store faults at address 0.", "The same io_map call is what check_for_panic_log() makes for the pram region, so the DT panic region is not armed either: PanicLogDxe finds no header and the device still reaches the menu, which is what the second boot showed.", "Apple's iBoot hands over an already-mapped virtual frame buffer, so this ordering hole is invisible on Apple hardware; the tag bit on Args->Video[0] is what selects the early branch here.", "Fix implemented as patches/xnu/zzz-defer-framebuffer-mapping.patch: initialize_screen() remembers the physical base and returns through the no-video path before STARTUP_SUB_KMEM, leaves gc_acquired FALSE, and maps the frame buffer in the kPEAcquireScreen call from kernel_bootstrap_thread, then initialises the console normally.", "The kernel rebuilt with that patch is 51,027,968 bytes (sha256 54c3565b...) and bootT.img (sha256 1c06b782...) carries it with the AMFI patch, the panic screen and the pram region.", "Two further pe_init.c patches were needed: check_for_panic_log() must return while kernel_map is NULL (with the pram node present it mapped the region at virtual address 0 before pmap_startup), and PE_initialize_console() arms it again once kernel_map exists.", "With those three patches (kernel a8c5d42b...) the kernel boots all the way to bsd_init: the panic screen drew 'failed to mount root device @IOKitBSDInit.cpp:984' with frames fffffff00797c384 fffffff0076e489c fffffff0072c4864 fffffff0074164a4 and pages=0x20000000 000f814c free=0x00000000 0f6f51.", "The panic screen drawing proves the deferred frame-buffer mapping succeeded: it draws through vinfo.v_baseaddr, which only exists after that mapping. The 480-row hand-off gives it a 2 MiB mapping the kernel can afford.", "board.toml [kernel] archives changed for the storage route; every [firmware] input (platform package, FD base and size, boot image layout) is unchanged, and the kernel step still produces kernel.macho a8c5d42b046ea416eb998276e4d00ad0843f12899fb71ab574c9ad9644433ec3."]
completion = ["Firmware enters UniXNU, publishes the framebuffer and preserves the memory reservations."]
limits = ["The kernel console is visible, but the boot still stops in the kernel after console creation; storage, display and input drivers for XNU are not validated.", "ABL rejects a dtb without qcom,msm-id, so the stock boot_a dtb is still used.", "The payload seed is a placeholder chip id.", "The generated ADT exports only the GIC under arm-io, so serial_init() has no uart and the panel is the only console."]
next_action = ["Move to storage: the handoff now reaches bsd_init and panics in vfs_mountroot because this board has no root device. Select or write the SM8250 UFS driver (storage area) and publish an IOMedia for the userdata volume."]
evidence = [{ kind = "device", reference = "docs/evidence/2026-11-09-device-menu.md", command = "fastboot boot bootD.img", result = "The UniXNU menu appears with a 60 s countdown; volume up/down move the selection and the power key confirms; xnu hands off through the DarwinBoot bar and crashes into 900E.", revision = "8ec13bb1077502e53e8ba3b82c56842589b5c837" }, { kind = "device", reference = "docs/evidence/2026-11-09-kernel-handoff-probes.md", command = "fastboot boot bootE.img; fastboot boot bootF.img; fastboot boot bootG.img; fastboot boot bootH.img; fastboot boot bootJ.img", result = "bootE (panic screen) drew green/blue/magenta bars then 900E with no text; the reset probes show arm_vm_init and kernel_startup_initialize_upto returning and PE_create_console not returning; bootJ (FD with Video[0] |= 1, sha256 93dbf6b8..., boot image sha256 3906afb7...) shows the -v kernel console on the panel.", revision = "8ec13bb1077502e53e8ba3b82c56842589b5c837" }]

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["dts/**"]
inputs = ["8 CPUs at MPIDR 0x000-0x700: four A55-class cores and four Cortex-A77 cores.", "GICv3 at 0x17a00000 (distributor) and 0x17a60000 (redistributors), PSCI over SMC."]
configuration = ["CPUs are inherited from soc:dts/sm8250.dtsi; the board exports all eight.", "timebase-frequency = <19200000>."]
procedure = ["dtc -I dts -O dtb -i <soc>/dts dts/instantnoodlep.dts"]
findings = ["/proc/cpuinfo reports implementer 0x51 part 0x805 on cpu0-3 and 0x41 part 0xd0d on cpu4-7, matching the SoC DTSI topology.", "The SoC has no FEAT_PAuth: ID_AA64ISAR1 has no address or generic authentication, so arm64e cannot be used."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each core."]
limits = ["Secondary-core bring-up is not verified; only the stock Android kernel has run on this board."]
next_action = ["Build the kernel with the SoC defconfig and check the CPU topology probe on hardware."]
evidence = [{ kind = "source", reference = "docs/evidence/2026-11-09-device-inventory.md", result = "CPU parts and MPIDR values read from /proc/cpuinfo." }]

