id = "gpu"
status = "planned"
components = []
paths = [
  "package/*Gpu*",
  "package/*Gmu*",
  "scripts/*adreno*",
]
inputs = [
  "Adreno 650 with its GMU at 0x3d6a000 and GPU SMMU at 0x3da0000, both disabled in the shared DTSI.",
