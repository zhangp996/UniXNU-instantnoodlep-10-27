[[area]]
id = "storage"
status = "host-verified"
components = ["ShengUfs", "VirtioMmioBlock", "VerifiedRoot"]
paths = ["board.toml", "configs/instantnoodlep_defconfig", "docs/evidence/2026-11-10-storage-route.md", "docs/evidence/2026-11-10-storage-table-build.md"]
inputs = ["UFS 3.0 host 1d84000, PHY 1d87000, ICE 1d90000.", "GPT userdata entry: first LBA 4133800, last LBA 30513146 (4 KiB LBA)."]
configuration = ["[userdata] first_lba/last_lba/lba_bytes and two windows (OS, SystemOS).", "include/ufs-soc-table.h in UniXNU-sm8250-common carries the controller facts; board.toml [kernel] archives names the storage components after the complete arm64 list."]
procedure = ["dd the GPT header with bs=4096 and parse the entry array at 0x2000.", "python3 ./unixnu tree|defconfig|build kernel -D ../UniXNU-instantnoodlep"]
findings = ["Route chosen: the upstream ShengUfs component (catalog id ShengUfs, runtime class NativeUfs, source NativeUfs.cpp) with a kona table, not a board-local fork; the component is fetched at 99d8bcd3 and builds to build/sheng-ufs/libShengUfs.a.", "The delta from ShengUfs (SM8550) to this board is small: GccUfs.h already carries the GCC base 0x100000 and the host window 0x1d84000+0x3000 that kona uses, and the driver adopts the firmware's controller state instead of programming clocks and PHY itself.", "What differs: the match string is qcom,sm8250-ufshc; the GCC branch offsets are 0x77010/0x77018/0x7701C/0x77020/0x7705C/0x77064/0x7709C/0x770B8/0x770CC; the PHY is 0x1d87000+0xe00; core_reset is GCC id 0x21 with BCR at 0x77000; and the kona ufshc node carries no iommus, so there is no SMMU takeover.", "One component now serves both SoCs: scripts/unixnu/tree.py links the resolved SoC feed into the assembled tree as soc/, scripts/build-arm-driver.py adds -I <tree>/soc/include for a component whose catalog entry sets soc_headers, UniXNU-sm8250-common/include/ufs-soc-table.h holds the kona entry, and NativeUfs.cpp adopts the entry that names the node's compatible, keeping the SM8550 values as the fallback.", "[kernel] archives is a replacing array: naming only the three storage components dropped corecrypto, the AES original-bindings archive, the mockfs fixture and libpthread from the link, which then fails on IOAESAccelerator. The list repeats the complete profiles/arch/arm64 order and appends the storage components.", "ShengUfs builds with -Werror and passes the arm64-apple-ios17.0 object audit; libShengUfs.a is sha256 5b9d398e1c633572c9263ebed7526a3a5a5d6410c99420c04f7f93adf9b8d5fb (517404 bytes) and the object carries both qcom,sm8250-ufshc and qcom,sm8250.", "The kernel still links and reproduces the booting image byte for byte (kernel.macho sha256 a8c5d42b046ea416eb998276e4d00ad0843f12899fb71ab574c9ad9644433ec3), because CONFIG_XNU_NATIVE_UFS is off and the archive is built but not force-loaded.", "With CONFIG_XNU_NATIVE_UFS=y the build stops at the XNU link on __ZTV20IOBlockStorageDevice and the VerifiedRoot policy symbols (vr_open, vr_verify_block, vr_xnu_crypto, verified_root_key/policies/policy_count, boot_progress_poll). The vtable belongs to the prelinked com.apple.iokit.IOStorageFamily kext, so a kernel object cannot link against it."]
completion = ["The UFS host enumerates, the OS window mounts read-only and launchd starts; Data persists."]
limits = ["The driver is not part of the delivered kernel: CONFIG_XNU_NATIVE_UFS stays off until the IOBlockStorageDevice vtable resolves, so nothing of this route has run on the phone.", "The VerifiedRoot policy symbols need the signed policy of the selected root images (scripts/build-verified-root-probe.py) and are not linked yet either.", "The SM8250 SoC repository and ShengUfs are pinned as local working trees in the Git-ignored local.toml; feeds.toml still names the published revisions."]
next_action = ["Resolve the storage family classes for arm64/17.7 - compile the pinned IOBlockStorageDevice.cpp into the archive the way scripts/build-sheng-source-storage.py does for arm64e, or resolve the vtable at prelink - then enable CONFIG_XNU_NATIVE_UFS and add native-ufs-root=1 to [payload] kernel_args and boot it."]
evidence = [{ kind = "source", reference = "docs/evidence/2026-11-10-storage-route.md", result = "Board measurements and the SM8550 to kona delta for the controller, PHY, GCC branches, core_reset and the missing SMMU." },
{ kind = "source", reference = "docs/evidence/2026-11-10-storage-table-build.md", result = "The four wiring changes, their repositories, the build result and the link wall behind CONFIG_XNU_NATIVE_UFS=y." },
{ kind = "host", reference = "docs/evidence/2026-11-10-storage-table-build.md", command = "python3 ./unixnu build kernel -D ../UniXNU-instantnoodlep", revision = "9fd5dc7251bcfa753fd15a56d8ba0929d2667895", result = "tree/soc linked, libShengUfs.a built from soc/include, kernel.macho sha256 a8c5d42b046ea416eb998276e4d00ad0843f12899fb71ab574c9ad9644433ec3 identical to the booting image." }]

