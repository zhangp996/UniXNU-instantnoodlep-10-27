configuration = ["No PMIC node is exported; the board currently inherits bootloader regulator state."]
procedure = ["Read the PMIC nodes from the stock DT."]
findings = ["No regulator or battery driver is selected; the board currently relies on bootloader state."]
completion = ["Regulators and battery units are owned by the OS and suspend/resume is defined."]
