schema_version = 1

[device]
name = "instantnoodlep"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "OnePlus 8 Pro IN2020 (SM8250/kona) bring-up through UniXNU: configuration resolves against a shared SM8250 SoC repository, hardware inputs come from the board itself."

[[area]]
id = "configuration"
status = "host-verified"
components = ["ArmDTPlatform","ArmCpu","SoftwareAES","XnuPrelink","DarwinBoot"]
paths = [
  "board.toml",
  "feeds.toml",
  "configs/**",
  ".gitmodules",
  ".github/**",
  ".gitignore",
]
inputs = [
  "Qualcomm SM8250 (kona) SoC profile. No published UniXNU-<soc>-common existed for kona, so this port creates UniXNU-sm8250-common per docs/porting/soc-support.md step 3.",
  "iPadOS 17.7.11 (21H461) OS profile, the only profile in this checkout; it supplies the Apple identity, prelink roots and the storage ABI.",
  "The arm64 profile selects ArmDTPlatform, ArmCpu, SoftwareAES and XnuPrelink; the device adds DarwinBoot for the loader.",
]
configuration = [
  "board.soc = SM8250, board.soc_source = sm8250, board.os_profile = ipados-17.7.11-21H461, board.kit = instantnoodlep.",
  "kernel.config_fragments applies arch:configs/common.config, soc:configs/sm8250.config and os:configs/ipados.config in order, then configs/instantnoodlep_defconfig.",
  "kernel.patch_series lists all four series; arrays replace inherited arrays, so arch, soc, os and device stay explicit.",
  "feeds.toml pins the SoC source as a local checkout until UniXNU-sm8250-common is published with a reviewed commit.",
]
procedure = [
  "./unixnu defconfig instantnoodlep_defconfig -D ../UniXNU-instantnoodlep",
  "./unixnu status -D ../UniXNU-instantnoodlep",
  "python3 scripts/porting-record.py check --device ../UniXNU-instantnoodlep",
]
findings = [
  "The resolver reports the arch, soc, os and device profiles, the five selected components with their owners, and the arm64 patch series in order; the soc profile resolves to the local UniXNU-sm8250-common checkout.",
  "The device defconfig carries only board differences because the arch fragment already sets PAN, the crypto sources and the build-archive switch.",
  "The CLI refuses Python older than 3.11 and Ubuntu 22.04 ships 3.10, so the WSL lane installs a standalone 3.12 with uv; no root password is needed.",
  "Tree assembly creates symbolic links, which a non-elevated Windows session rejects with WinError 1314, so tree runs in WSL.",
  "UniXNU's zzz-boot-progress.patch carries a hunk whose context is the XNU_SHENG_PMGR block that only the sheng platform-power patch adds to bsd_init.c; a kona tree has no such block, so the hunk is dropped before the series runs (the macOS workflow does it in the Adapt the shared patch series step).",
  "Kernel and payload build on the macOS runner because the kernel step calls Xcode and the payload step may call hdiutil; the workflow publishes kernel.macho and the payload directory as the boot-artifacts artifact so the boot image can be assembled wherever the firmware volume was built.",
  "The boot image uses header version 0: unixnu appends the device tree to the gzip kernel and passes no --dtb to mkbootimg, which a version 2 header would require. The shim is built without the ARM64 kernel header because Mu-Silicium writes FD_SIZE there while unixnu checks for shim plus volume.",
  "Storage moved to the bdevsw route on 2026-10-29: the defconfig sets CONFIG_XNU_KONA_UFS=y and [payload] kernel_args carries rd=ufsroot0/ufsroot=userdata; the driver and its memory-map/transport details stay in the storage area.",
  "The macOS workflow now also extracts the IPSW OS component and prints its APFS volumes with diskutil, then mounts it to inspect /sbin/launchd; [payload.adt] root_match_volume_uuid takes the System volume UUID from that output.",
  "board.example = true is deliberate while REQUIRED values remain: build and bootimg refuse an example repository, which is the only guard against an image built from zeroed geometry.",
]
completion = [
  "The resolver reports the intended profiles, components and patch order.",
  "No REQUIRED value remains and board.example is false.",
]
limits = [
  "Every REQUIRED hardware input in board.toml is now measured on this board: the GPT extent, the splash reservation, the DRAM span and the UFS interrupt.",
  "UniXNU-sm8250-common is published at commit 5b190cb and feeds.toml pins that commit, so a fresh checkout resolves the SoC source without a local path.",
]
next_action = [
  "Fill each REQUIRED value from the board in docs/hardware-inventory.md, then re-resolve and clear board.example.",
]
evidence = [
  { kind = "source", reference = "board.toml", result = "Format 2 board configuration: SM8250 SoC source, iPadOS 17.7.11 profile, five components, four-series patch order." },
  { kind = "host", reference = "docs/evidence/host-config-resolution.log", command = "unixnu defconfig instantnoodlep_defconfig -D ../UniXNU-instantnoodlep; unixnu status -D ../UniXNU-instantnoodlep; python3 scripts/porting-record.py check --device ../UniXNU-instantnoodlep", revision = "f242ec461d5aba013ac7c6a68058511f90f4415a", result = "The resolver reports arch, soc, os and device profiles, five components with their owners, the ordered arm64 series, and the record checker passes 13 areas." },
  { kind = "host", reference = "docs/evidence/host-dts-compile.log", command = "scripts/build-dts.sh ../UniXNU-sm8250-common/dts dts/instantnoodlep.dts /tmp/in2020/board.dtb", revision = "f242ec461d5aba013ac7c6a68058511f90f4415a", result = "dtc 1.6.1 compiles the board DTS against the SM8250 DTSI without warnings; the blob carries the oneplus,instantnoodlep compatible, eight tagged CPUs and the 19.2 MHz timer." },
  { kind = "host", reference = "docs/evidence/host-tree-wsl.log", command = "unixnu defconfig instantnoodlep_defconfig -D ../UniXNU-instantnoodlep; unixnu tree -D ../UniXNU-instantnoodlep", revision = "b370101e4be9634c677dfb36408c7322d71f7a25", result = "On WSL2 Ubuntu 22.04 with a uv-installed Python 3.12 the tree assembles at out/instantnoodlep/ipados-17.7.11-21H461/instantnoodlep/tree with drivers ArmCpu, ArmDTPlatform, DarwinBoot, NativeAES and SoftwareAES and kits NativePrelink, XnuPrelink and instantnoodlep." },
  { kind = "host", reference = "docs/evidence/host-published-pin.log", command = "unixnu defconfig instantnoodlep_defconfig -D ../UniXNU-instantnoodlep; unixnu status -D ../UniXNU-instantnoodlep; python3 scripts/porting-record.py check --device ../UniXNU-instantnoodlep", revision = "b7a6281ea30eaf66db27e051af8ed71674b42590", result = "With feeds.toml pinned to the published UniXNU-sm8250-common commit 5b190cb the resolver fetches the SoC source into out/feeds/UniXNU-sm8250-common-91e20bbb, still reports the five components, and the record checker passes 13 areas." },
]

[[area]]
id = "firmware"
status = "device-verified"
components = []
paths = [
  "proprietary-files.txt",
  "scripts/extract-files.py",
  "docs/**",
]
inputs = [
  "Mu-Silicium UEFI platform package for this board. Mu-Silicium ships OnePlus packages for kebab and lemonade but none for instantnoodlep.",
  "An unlocked bootloader; fastboot boot loads the image without touching a partition.",
  "Measured from the live device tree: the reserved-memory node lists hyp, cmd-db, smem, removed_region (0x80b00000, 0xcd00000), the adsp, cdsp, camera, cvp, video, npu, slpi, spss, gpu and wlan PIL regions, cdsp_secure_heap, cont_splash_region (0x9c000000, 0x2300000), disp_rdump_region, dfps_data_region and cnss_wlan_region.",
]
configuration = [
  "firmware.dsc and firmware.fd name the instantnoodlepPkg paths the port creates.",
  "firmware.packages lists the Mu-Silicium OnePlus platform root and the Silicium-ACPI OnePlus entries.",
  "board.toml [bootimg].dtb_node adds /reserved-memory/splash_region to the UEFI device tree.",
]
procedure = [
  "./unixnu build firmware --uefi ../uefi-instantnoodlep",
  "./unixnu bootimg --uefi ../uefi-instantnoodlep --dtb <board.dtb>",
  "fastboot boot out/instantnoodlep/<profile>/boot/boot.img",
]
findings = [
  "docs/porting/uefi-firmware requires UniXNURamDiskDxe, DiskIoDxe and FAT support in the DSC and FDF for an initrd payload; the package must add them, not assume them.",
  "The firmware is the first layer the bootloader runs, so a wrong memory map corrupts secure carveouts before any kernel code executes.",
]
completion = [
  "The firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented reservations.",
]
limits = [
  "The platform package is written from scratch: it selects no vendor DXE driver, so the firmware has no touch input and no UEFI-side UFS driver.",
  "The shared SiliciumPkg.dsc.inc and edk2 tools_def are patched locally for PE alignment: upstream links AArch64 images with /ALIGN:4096 (runtime drivers 0x10000) and no /FILEALIGN, which GenFv rejects when it rebases the images.",
  "The bootloader is unlocked (verifiedbootstate orange), so fastboot accepts an unsigned image.",
]
next_action = [
  "Boot the built firmware once the payload and boot image exist, then record the menu, the framebuffer and the DarwinBoot handoff.",
]
evidence = [
  { kind = "device", reference = "docs/bring-up.md", command = "fastboot boot boot-hdr.img", revision = "685d326e7250f14f4ad0679acaa313ca3a7b1e3b", result = "The firmware starts DxeCore, dispatches the driver volume, reaches the UniXNU menu, reads its payload, and DarwinBoot validates the inputs and exits boot services into the kernel entry point; the panel shows the hand-off bar. docs/bring-up.md records every assert and refusal fixed to get here." },
  { kind = "host", reference = "docs/evidence/host-firmware-build.log", command = "unixnu build firmware -D ../UniXNU-instantnoodlep", revision = "a671af8a2769178f91eec1fe0ccb4c013bea94f7", result = "The EDK II build completes and produces SILICIUM_UEFI.fd: 4194304 bytes (0x400000), FV signature _FVH, FV length 0x333000, about 40 FFS files including UniXNU, UniXNUDxe, UniXNURamDiskDxe and DarwinBoot." },
  { kind = "device", reference = "docs/evidence/device-fastboot-getvar-all.log", command = "fastboot oem device-info; fastboot getvar all", revision = "f20435abb20407a060fd83d888ceba3d717c827b", result = "Device unlocked: false, Device critical unlocked: false, secure:yes, Verity mode: true, slot-count 2; an unsigned UniXNU boot image cannot be started until the bootloader is unlocked." },
]

[[area]]
id = "cpu"
status = "planned"
components = []
paths = [
  "dts/**",
  "package/CpuFreq*",
  "scripts/*armcpu*",
]
inputs = [
  "Kryo 585: four Cortex-A55 (cpu0-cpu3, MPIDR affinity 1 value 0x0-0x3) and four Cortex-A77 (cpu4-cpu7, 0x4-0x7).",
  "GICv3 distributor at 0x17a00000 and eight redistributor frames from 0x17a60000 with a 0x20000 stride, from dts/sm8250.dtsi.",
  "Architectural timer at 19.2 MHz and PSCI 1.0 over SMC.",
]
configuration = [
  "dts/instantnoodlep.dts enables cpu0-cpu7 and tags cpu0-cpu3 unixnu,cluster-type = E and cpu4-cpu7 P, as docs/porting/platform.md requires for a two-core-type SoC.",
  "ArmCpu publishes the CPU nubs and programs the timer and GIC.",
]
procedure = [
  "Read /sys/devices/system/cpu/present, cpu*/topology/cluster_id and cpufreq/policy*/related_cpus over ADB.",
  "Boot with armcpu-diagnostics=1 and read each CPU's checkpoint.",
]
findings = [
  "The shared DTSI models the split as four A55 and four A77 nodes, which matches Kryo 585; the board DTS carries only enablement and cluster tags.",
  "The cluster tags exist so the ADT carries cluster-type for the scheduler patch, which docs/porting/platform.md restricts to a one-E-plus-one-P layout.",
  "dts/instantnoodlep.dts now also declares /kona-ufs (0x01d84000, 0x30000) for the bdevsw disk; CPU and GIC content is unchanged.",
]
completion = [
  "Every enabled CPU reaches its entry checkpoint and timer and IPI handling works on each enabled CPU.",
]
limits = [
  "The topology comes from the SoC profile; the board's own device tree has not been read yet.",
  "No UniXNU image runs on the board, so no CPU checkpoint exists.",
]
next_action = [
  "Confirm present and online CPUs and per-cluster frequencies over ADB, then record the measurement.",
]
evidence = []

[[area]]
id = "memory"
status = "device-verified"
components = []
paths = [
  "dts/**",
  "docs/**",
]
inputs = [
  "Measured from the live device tree: DRAM starts at 0x80000000 in three banks (0x80000000+0x3bb00000, 0xc0000000+0xc0000000, 0x180000000+0x100000000) on an 8 GiB board with MemTotal 7708100 kB.",
  "The ABL splash region, the SM8250 secure carveouts and the UEFI runtime regions are the reservations the firmware must preserve.",
  "The UFS host and the GPU sit behind their own SMMU instances; the display path has none.",
]
configuration = [
  "dts memory@80000000 carries the bank extent; [payload].dram_size passes the total to the ADT tool.",
  "[payload.adt].owned_memory_size is the window DarwinBoot requests.",
]
procedure = [
  "Read /proc/iomem and the reserved-memory nodes over ADB.",
  "Compare the firmware's published map with the ABL map once the firmware builds.",
]
findings = [
  "docs/porting/platform.md requires each handoff allocation to have an owner and each DMA engine to reach its allocated range before it submits work.",
  "The panic region is a memory fact, not a display one: a board header constant that is wrong for kona hangs the boot CPU with the MMU on, which is why the defconfig selects CONFIG_XNU_DT_PANIC_REGION.",
  "The bdevsw root reaches the APFS mount (bsd_init.c:1093 rootauth report with the bring-up patch), so the memory map, DMA window and UFS handoff are working; load_init_program's launchd ENOEXEC is a root-image/exec issue, and the debug patch reads the Mach-O header to prove whether the mapping returns valid bytes.",
  "The same DTS change adds the /kona-ufs MMIO window (0x01d84000+0x30000); the DRAM and reservation entries are unchanged.",
]
completion = [
  "All handoff regions are accounted for and every enabled DMA engine reaches its allocated range with the documented cache policy.",
]
limits = [
  "The board hands off one contiguous range while the stock tree has three banks; the carveout between 0xbbb00000 and 0xc0000000 stays inside the handed-off span.",
  "No SMMU stream has been read from this board.",
]
next_action = [
  "Compare the firmware's published memory map with the stock reservations once the firmware builds.",
]
evidence = [
  { kind = "device", reference = "docs/evidence/device-fdt.bin", command = "adb shell su -c 'cp /sys/firmware/fdt /data/local/tmp/fdt.bin'; adb pull; dtc -I dtb -O dts", revision = "7704d31be86e3d8c5f268bf617e8b0d6c05848f9", result = "The live device tree reports model kona MTP 19811, three DRAM banks 0x80000000+0x3bb00000, 0xc0000000+0xc0000000 and 0x180000000+0x100000000, and cont_splash_region at 0x9c000000 with size 0x2300000." },
  { kind = "device", reference = "docs/evidence/device-gpt.json", command = "adb shell su -c 'dd if=/dev/block/sda of=/data/local/tmp/gpt.bin bs=4096 skip=1 count=64'; adb pull", revision = "7704d31be86e3d8c5f268bf617e8b0d6c05848f9", result = "The 4096-byte-sector GPT puts userdata at LBA 4133800..30513146 (26379347 sectors, 100.63 GiB), matching the bootloader's partition-size report." },
]

[[area]]
id = "storage"
status = "planned"
# VerifiedRoot is selected in board.toml; KonaUfs is the IOMedia driver kept opt-in until
# the storage original bindings exist (see findings).
components = ["VerifiedRoot", "KonaUfs"]
paths = [
  "drivers/**",
  "scripts/*ufs*",
  "scripts/*storage*",
  "scripts/*userdata*",
  "patches/xnu/series",
  "patches/xnu/kebab-route/**",
]
inputs = [
  "Measured from docs/evidence/device-fdt.dts: ufshc@1d84000 covers ufs_mem 0x1d84000+0x3000 and ufs_ice 0x1d90000+0x8000 on SPI 265; the PHY is ufsphy_mem@1d87000, phy_mem 0x1d87000+0xe00, two lanes per direction.",
  "GCC is qcom,gcc@100000 (phandle 0x16) with 0x1f0000 bytes. The controller takes core_clk 0xa7, bus_aggr_clk 0x06, iface_clk 0xa6, core_clk_unipro 0xb3, core_clk_ice 0xaa, tx_lane0_sync_clk 0xb2, rx_lane0_sync_clk 0xb0 and rx_lane1_sync_clk 0xb1 from it, ref_clk from RPMH 0x15:0, and core_reset 0x21. The PHY takes ref_aux_clk 0xad from GCC.",
  "The live controller node carries no iommus property, so UFS is not behind the apps SMMU on kona: the ShengUfs SMMU takeover has no target here and the DMA path can stay identity-mapped.",
  "UFS 3.0 host controller at 0x1d84000 and QMP PHY at 0x1d87000, both disabled in the shared DTSI until a storage component is selected.",
  "SMMU stream IDs for the UFS host on kona.",
  "The board GPT: boot_a, boot_b and the userdata extent.",
]
configuration = [
  "CONFIG_XNU_KONA_UFS=y selects the bdevsw route: build-xnu-4k-baseline.sh adds -DKONA to CFLAGS_EXTRA and OTHER_CXXFLAGS, patches/xnu/series applies kona-ufs-driver (which now carries the frame-buffer early putc and /dev/konacon), kona-hfs-noop, kona-ufs-integration, kona-rootauth-bypass and the konacp checkpoint patches, and bsd/dev/kona_ufs.c is a standard file.",
  "kernel_args carries rd=ufsroot0 and ufsroot=userdata, so IOKitBSDInit selects the BSD disk before root-media matching; APFS mounts the container inside the userdata GPT partition.",
  "CONFIG_XNU_NATIVE_UFS is not set and board.toml keeps component:KonaUfs out of include: the IOMedia route compiles the archive but cannot link it until the storage original bindings exist, so both switches stay off together and turn the root over to IOStorageFamily in one step.",
  "[userdata] holds the write window and names the OS and SystemOS IPSW components.",
]
procedure = [
  "Read /proc/partitions, /sys/block/sd*/size and sd*/start and the by-name links over ADB, then compute the GPT extent.",
  "After selecting a reviewed storage component, compare SCSI capacity and known blocks before mounting root.",
]
findings = [
  "components/kona-ufs builds: the macOS lane produced build/kona-ufs/libKonaUfs.a (458 KiB) with no warning, so the kona constant table, the VerifiedRoot include and the storage ABI headers are all correct. The archive stays unlinked because it needs the IOStorageFamily kext class.",
  "A second route is staged in patches/xnu/kebab-route: GFander/UniXNU-kebab solves the same problem with a BSD-level bdevsw driver (no IOStorageFamily class) plus Apple's hfs-627 built into the kernel and rd=ufsroot0. Its register layout matches this board (host 0x1d84000, run/stop 0x60, PRDT {addr_lo, addr_hi, rsvd, dbc}); the patches were regenerated against this tree but the flow was rolled back to the documented one, so patches/xnu/series is empty and CONFIG_XNU_NATIVE_UFS stays unset.",
  "Firmware-side UFS is not a shortcut: the probe writes the descriptor into RAM correctly (it reads back after a cache invalidate) and uses the kebab encoding (utrd[0]=0x15000000, PRDT lo/hi/0/len-1), but the controller register file is not trustworthy while the power domain and clocks stay uncontrolled. GDSCR ignores a write that clears bit 31, VER differs on every boot (0x210, 0x1697031F, 0x1507031F), and the same probe reports OCS=0 with an untouched 0xAA data area on one boot and OCS=0x0F with IS=0x4 on another. The QMP PHY tables are ported and written (serdes 25, tx 6, rx 34, pcs 7, from Linux v5.10).",
  "The archive cannot be linked yet: NativeUfsBlock subclasses IOBlockStorageDevice, and that class is a kext of the original kernelcache. docs/guide/build-kernel.md line 112 prepares only the public headers under build/storage-abi/include; the documented binding route (scripts/audit-storage-interface.py plus build-virtio-mmio-bindings.py) reads build/darwinboot-storage-native-metadata/gdb-stop.json, a live debugger snapshot this board cannot capture (no serial console, no USB debug link).",
  "The kernel now reaches the root mount and refuses with Failed to mount root device @IOMediaBSDClient.cpp:984, which is the Stage 6 wall: with no block driver publishing OS and SystemOS there is no device to mount. The frames are fffffff0079b4a0 fffffff00792408 and the page counters advance, so the refusal is the storage gap and not an earlier kernel fault.",
  "docs/porting/ufs.md lists the inventory a storage port needs first: controller, PHY, clocks, resets, SMMU, DMA, handoff and layout; the board supplies every row.",
  "Selecting a component whose hardware scope is another SoC would produce a driver that programs the wrong registers, so the storage area stays planned until kona is reviewed.",
  "The kebab bdevsw route is enabled (2026-10-29): patches/xnu/series applies the 926-line bsd/dev/kona_ufs.c (a BSD disk that publishes ufsroot0 with 512-byte sectors over 4 KiB device blocks and selects the userdata GPT partition by default), a kona_early_putc stub, and the IOKitBSDInit rd=ufsroot0 hook. CONFIG_XNU_KONA_UFS=y adds -DKONA to CFLAGS_EXTRA and OTHER_CXXFLAGS because CFLAGS_EXTRA is not part of CXXFLAGS. The HFS patches stay unapplied: iPadOS roots on APFS, which is already in the prelinked kernel.",
  "The macOS workflow compiles and links the kernel with the bdevsw driver (kernel.macho sha256 842df627fe04c10231a124917e16b106917ae97d9c688125584620cf25ec829c); its payload step fails only because the workflow passes the raw IPSW trust cache while board.toml accepts the wrapped bundle, so the payload is built locally with trust.bundle and data-seed.img.",
  "First device run of the bdevsw route (2026-10-29): the IOKitBSDInit rd= hook fired and panicked with 'KONA UFS root ufsroot0 unavailable: 6'. The driver's first check needs a /kona-ufs DT node, which the board DTS lacked; it is now declared. The driver also rejected the DWC VER 0x1587031F and 4 KiB kernel pages; it now warns on the vendor version, allows 4 KiB, and panics with the init stage (dt/arg/map/ver/page/dma/host/tur/capacity/partition/bdevsw).",
  "The curated ADT puts hardware nodes under /arm-io, so /kona-ufs was still absent; scripts/unixnu/devicetree.py now carries it top-level. With the node in the ADT the same kernel passed dt and stopped at partition with EIO 5, so the driver now records the SCSI OCS/UPIU/status or the GPT read in the panic detail.",
  "The partition READ(10) returns CHECK CONDITION: UPIU response 1, SCSI status 2, sense 70 00 02 40 00 05 a1 0a 00 00 00 00 00 04 (sense key 2, NOT READY; the ASC/ASCQ bytes read 0x00/0x04). The official ShengUfs NativeUfs.cpp (lines 488-501 and 956-967) records the same state: bCurrentPowerMode 0x33 (UFS-PowerDown) makes every LU return NOT READY, and the device is resumed with START STOP UNIT, power condition ACTIVE (0x10), to the UFS Device well-known LU 0xD0, then TUR is polled. The bdevsw driver now follows that sequence (50 ms settle, 20 TUR attempts); the earlier START UNIT to LUN 0 with START=1 could not wake the device. It also keeps the host running for a well-formed CHECK CONDITION and retries the GPT header read five times.",
  "With the LU 0xD0 wake the GPT read and bdevsw publication succeed and the root mounts (the launchd probe later showed that mount was mockfs, not APFS), then bsd_init.c:1093 panics 'rootvp not authenticated after mounting': FSIOC_KERNEL_ROOTAUTH fails because the mountroot picked the unsealed Data volume of the userdata container. ufsroot=root has no GPT entry (the iOS container is on userdata).",
  "The OS component's System volume is 04769D26-2CA0-4825-B443-E2E5F88300F2 (diskutil apfs list), and [payload.adt] root_match_volume_uuid now carries it; the panic persists because that volume is unsealed (diskutil reports Sealed: No), so the sealed-root ioctl fails. A device-series patch kona-rootauth-bypass.patch reports the failed check and continues for bring-up; the stock panic returns when the patch is dropped, and the proper route is the VerifiedRoot owner policy.",
  "After the bypass the kernel reaches load_init_program, but execve('/sbin/launchd') fails with ENOEXEC (8). The workflow mounts the OS dmg and prints file/xattr/otool/lipo: /sbin/launchd is a valid uncompressed arm64 Mach-O (no com.apple.decmpfs xattr), so ENOEXEC is not the binary format. The bypass patch now reads /sbin/launchd with vnode_lookup/vn_rdwr after the root auth and panics with the first 8 header bytes and the residual (kona launchd hdr), so the next boot proves whether the read path returns the Mach-O.",
  "The probe settled it: the root was not APFS. vnode_size('/sbin/launchd') returned 108049805312, exactly the userdata partition size (26379347 x 4096), SystemVersion.plist did not resolve, and the first 8 bytes were the checksum at offset 0 of the APFS container. That is mockfs legacy behaviour: the OS profile sets CONFIG_XNU_SOURCE_MOCKFS=y, mockfs_mountroot accepts any device, and vfs_mountroot tried it before APFS, so /sbin/launchd was the whole partition. configs/instantnoodlep_defconfig now sets '# CONFIG_XNU_SOURCE_MOCKFS is not set'; mockfs is an offline fixture, not the board root.",
  "The bdevsw route cannot host APFS. konacp checkpoints (patches/xnu/kebab-route/kona-mountroot-cp.patch and kona-vfs-cp.patch) walk the boot: rootdev entry, disk published, bsd_autoconf, before net_init_run and before vfs_mountroot all fire, then vfs_mountroot returns ENODEV while the apfs mountroot returns ENOENT (2) without a single block request reaching kona_ufs_strategy. apfs is registered (konacp=10 lists 'apfs,' as the only mountroot-capable file system), and removing /chosen/root-matching changes nothing. UniXNU's alioth record measures the same failure through /dev/md0 (2026-10-26, 'offline scratch Data mount failed: 2') and names the fix: publish the device as a real IOMedia. A bdevsw disk has no IOMedia, so APFS declines it before I/O.",
  "The IOMedia route ran on 2026-10-30: board.toml selected KonaUfs beside VerifiedRoot for one CI run and the kernel link force-loaded build/kona-ufs/libKonaUfs.a. The component compiled clean under -Werror ('KonaUfs: -Werror build and actual ARM64/iOS 17 object audit passed'; 9 warnings, snprintf size arithmetic and the GET_LUN byte packing, stay non-fatal in the KonaUfs branch of build-arm-driver.py), then the link failed on exactly the base class the archive cannot carry: vtable for IOBlockStorageDevice, its OSMetaClass constructor and destructor, init, getProperty, doUnmap and doGetProvisionStatus. NativeUfsBlock overrides every other operation, so only the methods it inherits are missing, and they belong to the IOStorageFamily kext of the pinned kernelcache rather than to the kernel text. board.toml then kept component:KonaUfs out of include and the defconfig kept CONFIG_XNU_NATIVE_UFS unset; the record below binds them and both switches are back on.",
  "That binding has a recorded-value precedent in the tree: scripts/data/native-aes-original-bindings.S pins each imported original-kernelcache symbol with .globl/.set at an address measured once, and build-software-aes-bindings.py compiles the .S into original-bindings.o and archives it beside the driver object when the live audit evidence is absent. The addresses follow the kernelcache and prelink slide board.toml pins, not the board, so one record serves every device on this OS profile; the same file can therefore be produced for the storage class by reading the pinned kernelcache, which is the only route this board has.",
  "scripts/derive-storage-bindings.py (ported from UniXNU-sirius, BSD-2-Clause-Patent) derives that record offline: it walks __PRELINK_INFO to com.apple.iokit.IOStorageFamily, takes the single __DATA_CONST dispatch table whose 176 kernel-exported slots carry the pinned export and whose other 14 are the kext's own BRK traps, and proves the protected constructor, the base destructor and the metaclass by the code that materialises them. Against the kernelcache this profile pins (f18b4df865405f2a... at slide -0x1000000) it recorded 18 addresses and the dispatch table 0xfffffff006cb44c0, which covers all seven imports the link reported. build-arm-driver.py reads the compiled object's own undefined IOStorageFamily symbols, binds exactly those at address plus slide as absolute symbols in original-bindings.S, and archives the result with the driver, so the import list can never drift from the driver.",
  "The vinfo console booted on 2026-10-30 (kernel.macho 2baab5c5..., boot-hdr.img ab5ec2e7...): the panel drew 'konacon: framebuffer console ready' and then 'kona cp 11: apfs mountroot error 2 @vfs_subr.c:1419', with frames fffffff0074742a4 fffffff0076b4740 fffffff007996ce4 and pages 0xf7c27 free 0xf6927. So the console transport is solved, the UFS read path reached vfs_mountroot, and the APFS mountroot still declines the bdevsw disk with ENOENT before any block request. rd=ufsroot0 and ufsroot=userdata are removed from kernel_args: the root now has to come from the IOMedia the KonaUfs driver publishes, selected by [payload.adt] root_match_volume_uuid.",
  "That change was measured on 2026-10-30 with the same kernel (2baab5c5...) and only the argument set differing: without rd=ufsroot0 the panel shows 'Failed to mount root device @IOKitBSDInit.cpp:1004', and the frames resolve to boot/kernel_bootstrap_thread -> bsd_init + 0x738 -> IOFindBSDRoot + 0xc70 -> IOFindBSDRoot.cold.4 + 0x64, pages 0xf7c26 free 0xf6a2b. So IOFindBSDRoot finds no root media at all once the bdevsw disk is not forced: the KonaUfs IOMedia is either not publishing or not matching, which is what the diagnostic page's native_ufs_blocks_published row has to answer before the driver is changed.",
  "The diagnostic page answered it on 2026-10-30 (boot-progress=2): 'requests=0 verified=0 failures=0 integrity=0 published=0 | probe=21 match=1 root=0', no UFS command ever issued (CMD n=0 ocs=ff), and the driver's own row read requests=0. root=0 is native_ufs_root_step, whose first assignment is startRoot(); NativeUfs::probe returns false before it because neither native-ufs-probe nor native-ufs-root was on the command line. kernel_args now carry native-ufs-root=1, and the publication's signed-identity step (validate(), which returned false whenever NATIVE_VERIFIED_BLOCK is off) records a bring-up bypass instead, matching kona-rootauth-bypass.patch on the BSD side.",
  "Thenative-ufs-root=1 boot moved the page from root=0 to root=1: startRoot() was entered and hostBringUp() refused. published and requests stay 0 and no command is issued. The reason string is recorded (rootDiagnosticFailure sets native_ufs_root_failure) but row 2 of the diagnostic page cuts it: the row already spends 85 of its 120 columns before the 40-character reason, so the page shows root=1 with nothing after it. The reason now rides at the end of the CMD row of formatUfsRootDiagnostics instead, which already prints on a live page.",
  "The controller mapping, not the takeover logic, was the last wall. A firmware dry run (UfsProbeDxe, extended to repeat every hostBringUp check before handoff) passed all six: HCE bit 0 set, HCS low nibble 0xF, no outstanding doorbell, the request list stops in 0 ms, UTRLBA reads back after a write and the queue restarts in 0 ms. The kernel's refusal codes therefore never fired, and root=1 meant hostBringUp() never returned: the first controller read stalled. It was mapped through IOMemoryDescriptor with kIOMapInhibitCache; MMIO needs device memory, and a Normal mapping of a device range can stall the reader instead of faulting. The window now goes through ml_io_map, the mapping kona_ufs.c has always used on the same range, with the extern declaration that driver also carries because iOS 17 does not declare it. kona has no iommus property, so smmuBypassStream is a no-op: two unconditional uses of the empty map (a dereference and a read of SMMU offset 0x24) now require a mapped base. After that the driver ran 61 commands and published the OS window.",
  "The root image was installed on 2026-10-31 with the documented fastboot flash userdata. The Windows platform-tools build is 32-bit (machine 0x014c, both the installed copy and platform-tools-latest-windows.zip), so an 8.74 GiB image fails fastboot with std::bad_alloc before any transfer; -S cannot help because the file is mapped up front. The documented tool path works through WSL: usbipd-win 5.3.0 attaches the fastboot device (bus 1, port 1) and the Ubuntu 22.04 android-tools-fastboot binary is 64-bit. The flash reported 12 sparse chunks, Finished in 2207 s. Two lessons for the record: every phone reboot re-numbers /dev/bus/usb/001/NNN and needs chmod a+rw again, and the vendor flashing tool (SmartTool.exe) spawns its own fastboot processes that hold the device exclusively. docs/porting/ufs.md also asks for clock enables, power state, HCE/HCS, link state and request-list base to be read before ownership changes, and for the GCC branch enable and hardware-gating bits to be read together; the refusal path logs exactly those (GDSC, AXI/AHB/UniPro/AUX, CAP/VER/IS/HCS/HCE/UTRLBA/doorbell/UTRLRSR) to the console the page shows, reading the controller only while the domain reports powered.",
  "The first kernel with the storage bindings linked and booted on 2026-10-30. The panel drew a panic whose frames resolve, through the symbol table of that kernel.macho, to bsd_init + 0x738, IOFindBSDRoot + 0x670, kona_ufs_rootdev + 0x71c, kona_early_putc + 0xa4, io_map + 0x160 and kmem_alloc_guard_internal + 0x6b8: kmem_alloc(..., 10264576, 0x100021) failed with 3 (KERN_NO_SPACE) @vm_kern.c:180. 10264576 is round_page(1080 x 2376 x 4), so the request is the /dev/konacon console mapping the panel through ml_io_map on its first kona_cp: PE_state.video.v_baseAddr is already the kernel's own mapping of the frame buffer, the one xnu-panic-screen.c draws through, and asking kernel_memory_allocate for a fresh 10 MiB hole panics before the root device ever opens. kona_early_putc now uses v_baseAddr directly and the ml_io_map call is gone; the register window at UFS_MMIO_SIZE still maps that way, which is a page-scale request.",
  "The console commit that merged /dev/konacon into kona-ufs-driver.patch (1116 lines) also dropped kona-ufs-early-putc.patch from the series, but kona-hfs-noop.patch still anchored its HFS stub on the early-putc stub that had sat above the includes: the series stopped at that patch, so no run since then has reached the storage link. The stub is regenerated against the block that replaced it and now sits above kona_ufs_rootdev, where kona_ufs_rootdev's own declaration of it resolves; driver and stub patches apply in order on a scratch tree.",
  "The next run reached the archive step for the first time: all six kebab-route patches applied, KonaUfs compiled and the binding block ran, then stopped because derive-storage-bindings.py --check was called without arguments and the archive step precedes the prelink, so build/kernel/kernel.json does not exist yet. The check now takes the kernelcache whose sha256 matches the record and the recorded slide, and refuses a tree whose out/ipsw holds a kernelcache the record was not derived from.",
  "With the image installed the driver reads the manifest from the device (magic 474e4853 544f4f52), finds both windows and publishes the first one, but the APFS container cannot attach: the OS window holds a whole-disk image, not a bare container. Measured in the built image: sector 0 is a protective MBR (55aa) and sector 1 is a GPT header (EFI PART); the single partition starts at LBA 34 (byte 0x104400 inside the window) and its first block carries NXSB at +0x20 with block_size 4096 and block_count 1483776 (6,077,546,496 bytes, the partition size). The volume superblock at image offset 0x3E1C420 carries uuid 04769d26-2ca0-4825-b443-e2e5f88300f2, which matches root_match_volume_uuid, so the UUID is right and the offset is what blocks the mount. Two obstacles: the kernel has no GPTPartitionScheme at all (the string does not occur in kernel.macho; only IOApplePartitionScheme, for the old Apple partition map, does), so the documented partition-scheme path cannot parse these images; and the container start 0x104400 is 512-byte aligned but not 4096-byte aligned, while RootLayout.h requires a 4096-byte offset and the read path issues whole 4 KiB reads. The remaining work is therefore to accept a 512-byte aligned window and to read across the 4 KiB boundary.",
  "The boot page freezes after its first frame whenever native-ufs-root=1, and stays live with native-ufs-root=0 on the same kernel (idle=55s, IRQ=1150, monitor=39). It is not the IOKit match thread being busy: moving the whole bring-up to its own kernel thread left the frame frozen at idle=0s. Treat the page as unavailable for diagnosis while the root path runs until this is understood.",
  "Checkpoint 2026-10-31 05:00. Starting the UFS work during IOKit matching stalled the whole machine: the page froze after its first frame and the phone reset into EDL about five seconds later, while native-ufs-root=0 kept the page live (idle=55s, IRQ=1150, monitor=39) with the driver matched and probed (probe=21 match=1). native-ufs-delay=10 changes that: the bring-up thread sleeps ten seconds first, the page keeps updating (idle=29s) and the phone no longer resets, but native_ufs_root_step stays at 1 with zero commands issued, so the first controller access blocks that thread for good without stalling the machine. The page is therefore usable as an observation channel again, and the stage codes 41-51 are back in hostBringUp: a single number now names the step that never returned.",
  "2026-10-31, second session. The controller's accessibility is not stable: the same kernel that ran three commands and reached the command-submit trace with native-ufs-delay=10 freezes the whole machine the moment the bring-up thread wakes with native-ufs-delay=5 or 20 (page pinned at idle=5s and idle=19s, root=0). Earlier still, the pre-deferral kernel ran 61 commands and published a window with no delay at all. Driving the host from the state the bootloader left is therefore not safe: the register block answers for a while and then wedges the interconnect, and the point where it stops moves with timing. The next step is the documented ownership work in docs/porting/ufs.md: the GCC branch and GDSC state and the power domain that ShengUfs leaves to the SoC DTSI and to firmware are exactly what this board is missing, and without them every access is a race.",
]
completion = [
  "Host: register, clock, link and SMMU facts match the board inventory.",
  "Reads: capacity, GPT and known blocks are correct and both windows stay inside userdata.",
  "Root: the configured volume mounts and launchd starts; writes survive reboot inside the Data region.",
]
limits = [
  "Measured from the dumped GPT: userdata runs from LBA 4133800 to 30513146 with 4096-byte sectors (26379347 sectors, 100.63 GiB), matching the bootloader's partition-size report.",
  "The firmware probe read VER/CAP/HCS/HCE/IS and the PHY PLL, but the register file is only trustworthy while the bootloader's clocks and power domain stay up; the kernel driver reuses that state and has no cold-init sequence.",
  "ShengUfs's constants target SM8550 host 0x1d84000 with PHY 0x1d80000 and apps SMMU stream 0x60; kona differs in the PHY offset (0x1d87000), the GCC ids and the absence of an SMMU stream, so its table cannot be reused unchanged.",
  "scripts/data carries the recorded original bindings for AES (native-aes-original-bindings.S) and for the Adreno kit, but none for the storage class: build-virtio-mmio-bindings.py is the only producer of that record and it reads build/storage-abi/interface-audit.json, which audit-storage-interface.py derives from a live gdb-stop.json this board cannot capture.",
]
next_action = [
  "Record the seven IOBlockStorageDevice imports (vtable, OSMetaClass constructor and destructor, init, getProperty, doUnmap, doGetProvisionStatus) from the pinned kernelcache as scripts/data/storage-original-bindings.S, in the format of native-aes-original-bindings.S.",
  "Compile that record into original-bindings.o and archive it into build/kona-ufs/libKonaUfs.a the way build-software-aes-bindings.py does for AES, then re-enable component:KonaUfs in board.toml and CONFIG_XNU_NATIVE_UFS in the defconfig.",
  "Boot again and read the result: IOStorageFamily should publish the userdata IOMedia and APFS should mount it; a missing kext reads as no media rather than as a link error, and /dev/konacon is the channel the panel draws once userland output starts.",
]
evidence = [
  { kind = "device", reference = "docs/evidence/device-fastboot-getvar-all.log", command = "fastboot oem device-info; fastboot getvar all", revision = "f20435abb20407a060fd83d888ceba3d717c827b", result = "Device fa8620b3 (product kona, hw-revision 20001, current-slot a of 2): boot_a and boot_b 96 MiB, userdata 100.63 GiB (26379347 4096-byte sectors), super 14 GiB; the bootloader is locked with verity on, so the storage path cannot run yet." },
]

