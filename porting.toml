]
configuration = [
  "CONFIG_XNU_NATIVE_ADRENO is not set, in the defconfig and in soc:configs/sm8250.config.",
]
procedure = [
  "Read the GPU speed bin, firmware names and AOP command-DB levels over ADB.",
]
findings = [
  "docs/porting/soc-support.md records that the catalog has no A650 component; the SM8550 GPU components are a different generation with different register layouts and HFI tables.",
]
completion = [
  "GPU submissions complete, mapping and fences are correct, a known image renders and a Metal client presents it.",
]
limits = [
  "No A650 component exists in the catalog.",
  "Firmware names and the speed bin are unmeasured.",
]
next_action = [
