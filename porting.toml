findings = ["The two 21H461 trust modules bundle to sha256 7416ca4f..., which is the profile's accepted hash.", "The boot partition is 96 MiB; payload 88 MiB + 0.94 MiB DTB + 3 MiB firmware fits at 94,339,072 bytes.", "The BootShim image_size field needs the local one-line fix described in the boot-image log.", "The kernel step now builds and links the complete archive set (corecrypto twice, ArmDTPlatform, ArmCpu, SoftwareAES with its original bindings, the mockfs fixture, libpthread, then component:ShengUfs with VirtioMmioBlock and VerifiedRoot) and still produces kernel.macho a8c5d42b046ea416eb998276e4d00ad0843f12899fb71ab574c9ad9644433ec3; the payload and boot-image inputs are unchanged."]
