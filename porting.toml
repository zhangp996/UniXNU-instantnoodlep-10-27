inputs = ["No serial console; the stock kernel uses ttyMSM0 at 0xa90000 and the UEFI menu framebuffer.", "UniXNU entry probe (scripts/patch-xnu-entry-probe.py): colour bars, positional reset and the panic screen."]
configuration = ["[payload] panic_screen = true installs the panic screen; entry_probe_reset_delay with entry_probe_reset_after moves the reset probe to a named call.", "Kernel console is the panel: the frame buffer is handed to XNU as a physical address with bit 0 set."]
procedure = ["python3 ./unixnu build payload -D ../UniXNU-instantnoodlep --unique-chip-id <seed> --trust-cache out/ipsw/21H461/trust.bundle", "Repack the boot image with the shim+FD kernel and the new payload; fastboot boot it and read the panel."]
findings = ["Three colour bars (green hand-off, blue kernel entry, magenta pre-MMU) localise the kernel stage without any log transport.", "A reset probe converts one boot into one yes/no answer about a named call; arm_vm_init and kernel_startup_initialize_upto returned, PE_create_console did not.", "The panic screen cannot draw before PE_create_console because vinfo.v_baseaddr is still zero; after the frame-buffer fix the -v console is readable.", "boot-progress=1 is inert in this build: the tree has kern/boot_progress.h but no implementation, and XNU_BOOT_PROGRESS is undefined.", "The widened [kernel] archives list leaves the kernel image unchanged (kernel.macho sha256 a8c5d42b046ea416eb998276e4d00ad0843f12899fb71ab574c9ad9644433ec3, the image bootX.img carries), so the panic screen, the colour bars and the console path are the same as the last photographed boot."]
completion = ["Firmware and kernel checkpoints are captured and linked from this record."]
limits = ["No UART and no persistent log transport; everything observed is a photograph of the panel.", "The panic screen and the positional reset probe do not fit in the same kernel copy, so they are used in separate builds."]
next_action = ["Photograph the panic text, then extend the reset ladder past PE_create_console."]
evidence = [{ kind = "device", reference = "docs/evidence/2026-11-09-kernel-handoff-probes.md", command = "fastboot boot bootE.img / bootF.img / bootG.img / bootH.img / bootJ.img", result = "Colour bars, three positional resets and the first kernel console text on the panel.", revision = "8ec13bb1077502e53e8ba3b82c56842589b5c837" }]

