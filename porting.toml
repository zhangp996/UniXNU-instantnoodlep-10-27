]
inputs = [
  "A log transport for bring-up. The board has no serial console; the USB CDC-ACM path and the panel are the only channels.",
]
configuration = [
  "kernel_args carry -v, debug=0x14e and the panic-screen switch in [payload].",
  "board.example = true keeps the build from producing an image out of zeroed geometry.",
]
procedure = [
  "Record the last completed checkpoint per boot: firmware menu, loader handoff, kernel handoff, root mount.",
  "Keep the firmware log and the panel photograph with the image revision.",
]
findings = [
  "docs/guide/debugging.md documents the green-bar entry probe and the device-tree panic region as the two evidence channels before the kernel can draw.",
]
completion = [
