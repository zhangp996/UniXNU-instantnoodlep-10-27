configuration = ["No Wi-Fi or Bluetooth node is exported; the stock DTBO bt_qca6390 node and the WLAN regulators are the inputs to add."]
procedure = ["Read the stock DTBO for the WLAN/BT regulators and firmware paths."]
findings = ["The board uses a QCA6390 combo; no network component is selected."]
completion = ["The OS associates and passes packets."]
