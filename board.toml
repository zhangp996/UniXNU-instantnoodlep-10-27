schema_version = 2

[board]
name = "instantnoodlep"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "OnePlus 8 Pro (IN2020): SM8250, 8 GiB, 1440x3168 DSC command panel, S6SY791 touch"
kit = "instantnoodlep"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot", "ShengUfs", "RamBlock", "VirtioMmioBlock", "VerifiedRoot", "QcomXnuUsbDebug", "GopFramebuffer"]

[kernel]
# Arrays replace inherited arrays, so this list is the complete one: profiles/arch/arm64/profile.toml
# (corecrypto, platform, AES and its original-bindings archive, fixtures, libpthread) plus the
# storage route. A selected component recipe also has to be named here or the archive plan reports
# "needs component entries for". ShengUfs is the upstream UFS component (catalog id ShengUfs,
# runtime class NativeUfs); VirtioMmioBlock and VerifiedRoot are its declared dependencies.
archives = ["build-corecrypto-14.py", "build-corecrypto-14.py --namespace",
            "component:ArmDTPlatform", "component:ArmCpu", "component:SoftwareAES",
            "build-software-aes-bindings.py", "build-mockfs-fixture.py", "build-libpthread-kernel.py",
            "component:ShengUfs", "build-verified-block-bridge.py", "component:RamBlock",
            "component:VirtioMmioBlock", "component:VerifiedRoot", "component:QcomXnuUsbDebug", "build-boot-progress.py", "build-ram-watchdog.py"]
defconfig = "instantnoodlep_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "device:patches/xnu/prereq-series", "os:patches/xnu/series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/instantnoodlep.dts"
include_dirs = ["soc:dts"]

[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 0x0C
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"

[userdata]
# GPT entry "userdata" on UFS LUN 0, 4 KiB LBAs (blockdev: sda23 start 33070400 x 512 B).
first_lba = 4133800
last_lba = 30513146
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[payload]
panic_screen = false
volume = "OP8PRO"
timeout = 60
# boot_a is 96 MiB (sde11: 98304 KiB); the payload must fit with the boot shim and DTB.
size_mib = 160
loader = "firmware"
# The panel is this board's only console: patch the panic screen into the payload
# copy of the kernel. entry_probe_reset_delay + entry_probe_reset_after = "<symbol>"
# replace it with a positional reset probe (the two do not fit in one kernel copy).
title = "UniXNU"
dram_size = "0x200000000"
# debug=0x14e, -no_slto_panic and amfi_get_out_of_my_way=1 come from the reference
# port for this board: AMFI panics with "No PMGR?" until a PMGR provider exists, and
# the spinlock-timeout panic has to be off while the timer path is still unverified.
# native-ufs-root=1 starts the selected storage component's root path once the kernel is up: it
# adopts the controller the firmware left running and publishes the userdata windows as an IOMedia.
kernel_args = ["-v", "serial=3", "debug=0x14e", "-no_slto_panic", "amfi_get_out_of_my_way=1",
               "native-ufs-root=1", "native-ufs-allow-unverified=1", "root-unverified=1", "native-ufs-diagnostics=1",
               "qcom-usb-debug=1"]

[payload.adt]
# Panic region: XNU's DT panic path (CONFIG_XNU_DT_PANIC_REGION) reads
# /chosen/embedded-panic-log-size and the pram node's reg. PE_create_console()
# maps this region before the console exists, so a panic that the screen cannot
# show is still left in DRAM, and PanicLogDxe prints it on the next boot.
# The address is PE_create_console()'s PANIC_LOG_BASE; it sits in the free window
# between the firmware volume (0x9E400000 + 4 MiB), the UEFI stack (0x9F000000 +
# 2 MiB) and kboot_uboot_logmem (0x9FE00000), and below the DarwinBoot window at
# 0xC0F98000.
chip_id = "0x164"
owned_memory_size = "0x100000000"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
psci_method = "smc"
packed_data_ramdisk = true
ipad_identity = true
unique_chip_id = "required"

# The whole-device-tree tables ([adt] below) are what the ADT generator turns
# into root nodes; [payload.adt] only carries the handoff scalars above.
[adt.chosen.u32]
"amfi-only-platform-code" = 0   # bring-up: let the cryptex binaries run
embedded-panic-log-size = "0x80000"

[adt.pram.u64s]
# Apple's pram reg is two 64-bit cells: the physical base and the region size.
# xnu's check_for_panic_log() rejects anything but 2 * sizeof(uintptr_t).
reg = ["0x9F400000", "0x80000"]

[firmware]
config = "instantnoodlep"
dsc = "Platforms/OnePlus/instantnoodlepPkg/instantnoodlep.dsc"
fd = "Build/instantnoodlepPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Mu_Basecore", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/OnePlus",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "1"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "instantnoodlep-research"

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "instantnoodlep_defconfig"

[bootimg.image]
kernel_compression = "none"
