schema_version = 2

[board]
# Follows examples/device. Keep example = true until every REQUIRED value below is
# measured on the board: build and bootimg refuse an example repository on purpose.
example = true
name = "instantnoodlep"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "OnePlus 8 Pro (instantnoodlep, IN2020/IN2021/IN2023/IN2025)"
kit = "instantnoodlep"

[components]
# The template selection: the arm64 platform pair, the crypto path, the prelink tool
# and the loader. Storage, display and input components are added per
# docs/porting/drivers once their required inputs are satisfied for this board.
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[userdata]
# REQUIRED: the GPT extent of the userdata partition (docs/porting/steps.md step 1).
#   lba_bytes            logical block size of the LUN that carries userdata
#   first_lba, last_lba  the partition's first and last LBA
# The zeros keep the resolver honest: a wrong extent writes outside userdata.
first_lba = 0x0
last_lba = 0x0
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "instantnoodlep_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[firmware]
# Mu-Silicium platform package for this board, created in a Mu-Silicium fork per
# docs/porting/uefi-firmware. The tree ships OnePlus packages for other models on
# the same SoC family but none for instantnoodlep, so this path does not exist yet.
config = "instantnoodlep"
dsc = "Platforms/OnePlus/instantnoodlepPkg/instantnoodlep.dsc"
fd = "Build/instantnoodlepPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/OnePlus",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/OnePlus",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "instantnoodlep"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "instantnoodlep-research"

[payload]
volume = "INSTNPDLP"
# REQUIRED: the ramdisk, the boot shim, the firmware volume and the appended device
# tree must fit boot_a with 8 MiB to spare. Read the partition size first.
size_mib = 128
loader = "firmware"
title = "Boot"
# REQUIRED: total DRAM of this board (8 GiB = 0x200000000, 12 GiB = 0x300000000).
dram_size = "0x200000000"
skip_setup_tool = "scripts/seed-data-skip-setup.py"
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  # docs/guide/debugging.md: the device-tree panic region keeps the kernel from
  # dereferencing the board header's hardcoded peripheral address.
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
]

[payload.adt]
# chip_id and owned_memory_size follow the OS profile and the SoC; the unique chip id
# is generated per board at payload time.
chip_id = "0x164"
owned_memory_size = "0x100000000"
unique_chip_id = "required"

[bootimg]
# REQUIRED: the ABL keeps the panel powered through the reserved-memory node named
# cont_splash_region; the same values must appear in dts/instantnoodlep.dts.
dtb_node = [{ path = "/reserved-memory/splash_region", props = [{ name = "label", type = "s", value = "cont_splash_region" }, { name = "reg", type = "x", value = ["0x0", "0x0", "0x0", "0x0"] }] }]

[device_tree]
source = "device:dts/instantnoodlep.dts"
include_dirs = ["soc:dts"]
