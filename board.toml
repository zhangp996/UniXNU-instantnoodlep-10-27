schema_version = 2

[board]
# Every hardware input below was measured on this unit: the GPT extent, the splash
# reservation, the DRAM span and the UFS interrupt. No REQUIRED placeholder remains,
# so the repository may build.
example = false
name = "instantnoodlep"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "OnePlus 8 Pro (instantnoodlep, IN2020/IN2021/IN2023/IN2025)"
kit = "instantnoodlep"

[components]
# The template selection: the arm64 platform pair, the crypto path, the prelink tool
# and the loader. Storage, display and input components are added per
# docs/porting/drivers once their required inputs are satisfied for this board.
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
# KonaUfs is the local fork under components/kona-ufs (see its README): it carries the
# SM8550 ShengUfs sources with this board's constants and without the apps-SMMU step.
# Select it once the component entry is merged into the catalog; the plain ShengUfs entry
# stays out because its scope is the SM8550 controller.

[userdata]
# Measured from this board's GPT (LUN 0 of 1d84000.ufshc, 4096-byte logical sectors,
# dumped with dd and parsed): userdata runs from LBA 4133800 to LBA 30513146, which is
# 26379347 sectors = 100.63 GiB and matches the bootloader's partition-size report.
first_lba = 4133800
last_lba = 30513146
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "instantnoodlep_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# docs/porting/drivers.md: once a component recipe is selected it must be named here, or
# the archive plan reports "needs component entries for". ArmCpu, ArmDTPlatform,
# SoftwareAES and DarwinBoot are firmware/os/tool stages and are not kernel archives.
# The arch profile's archive chain, repeated in full: a board list replaces it rather
# than extending it, and dropping the fixture left vfs_conf.o with undefined mockfs
# symbols at the real link.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
]

[firmware]
# Mu-Silicium platform package for this board, created in a Mu-Silicium fork per
# docs/porting/uefi-firmware. The tree ships OnePlus packages for other models on
# the same SoC family but none for instantnoodlep, so this path does not exist yet.
config = "instantnoodlep"
dsc = "Platforms/OnePlus/instantnoodlepPkg/instantnoodlep.dsc"
fd = "Build/instantnoodlepPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
# The Mu-Silicium tree is assembled from pinned archives rather than a git clone, so it
# has no .git and the driver cannot run "git submodule update" in it. These four trees
# are already populated at the pinned revisions:
#   Common/Mu, Common/Mu_OEM_Sample, Silicium-ACPI,
#   Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl
# submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
# The shared edk2 tree is an extracted archive, so the driver's "git apply --check" has
# no repository to run in. Apply this by hand with "patch -p1" inside the edk2 checkout
# before building if the GIC spurious-interrupt erratum matters for the board.
# patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/OnePlus",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/OnePlus",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "instantnoodlep"
MEMORY_PROTECTION = "FALSE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "instantnoodlep-research"


# Bring-up: AMFI panics with "AMFI: No PMGR?" because this board has no PMGR
# provider yet. docs/devices/erhai.md records the same approach for its bring-up
# profile: AMFI removed from the prelink. The root list is the OS profile's, minus
# com.apple.driver.AppleMobileFileIntegrity. Restore it once a PMGR provider exists.
[kernel.prelink]
roots = ["com.apple.AppleFSCompression.AppleFSCompressionTypeZlib", "com.apple.driver.AppleARMPlatform", "com.apple.driver.AppleARMWatchdogTimer", "com.apple.driver.AppleAudioClockLibs", "com.apple.driver.AppleEffaceableStorage", "com.apple.driver.AppleIISController", "com.apple.driver.AppleM2ScalerCSCDriver", "com.apple.driver.ApplePMGR", "com.apple.driver.IODARTFamily", "com.apple.filesystems.apfs", "com.apple.iokit.CoreAnalyticsFamily", "com.apple.iokit.IOAVFamily", "com.apple.iokit.IOAudio2Family", "com.apple.iokit.IOCECFamily", "com.apple.iokit.IOCryptoAcceleratorFamily", "com.apple.iokit.IOGPUFamily", "com.apple.iokit.IOHDCPFamily", "com.apple.iokit.IOMobileGraphicsFamily", "com.apple.iokit.IOReportFamily", "com.apple.iokit.IOSlowAdaptiveClockingFamily", "com.apple.iokit.IOStorageFamily", "com.apple.iokit.IOSurface", "com.apple.kec.Libm", "com.apple.kec.corecrypto", "com.apple.kext.AppleMatch", "com.apple.kext.CoreTrust", "com.apple.security.AppleImage4", "com.apple.security.sandbox", "com.apple.iokit.IOHIDFamily", "com.apple.iokit.IOHIDEventDriver"]
early_security_init = ""

[payload]
volume = "INSTNPDLP"

# The firmware volume has no keyboard driver yet, so nobody can pick an entry.
# timeout = 0 boots the generated default entry ("xnu") immediately instead of
# waiting; UniXNU falls back to its own fallback_timeout when no input device exists.
# Menu timeout in seconds. 0 boots the default entry at once, which is why the menu
# never stayed on the panel; this board has no key input driver yet, so a few seconds
# are also the only way to see the menu at all.
timeout = 10

# The early entry probe is deliberately off: it proved the entry and the MMU enable,
# but its inline assembly uses an identity-mapped address and dies once pmap switches,
# so anything after that point would be the probe failing, not the kernel. The panic
# screen stays on, because it runs inside the kernel's own panic path and is what makes
# a fault readable on a board without a serial console.
panic_screen = true

# A bisect with entry_probe_reset_after = "_arm_vm_init" is not usable on this
# kernel: patch-xnu-entry-probe.py exits without a message when it cannot resolve
# that call site, so the payload build fails. The timed reset (entry_probe_reset_delay)
# does work and is the way to re-check that the MMU enable completes.
# boot_a and boot_b are 96 MiB each (measured with fastboot getvar all). The ramdisk,
# the boot shim, the firmware volume and the appended device tree all live in one of
# them, and the image keeps 8 MiB of the partition free, so the volume is bounded here
# at 80 MiB. Re-measure once the shim and firmware volume sizes are known.
size_mib = 80
loader = "firmware"
title = "Boot"
# The ADT generator requires one contiguous DRAM range and checks this value against
# the DTS memory node. The stock tree describes three banks with carveouts between
# them (0x80000000+0x3bb00000, 0xc0000000+0xc0000000, 0x180000000+0x100000000); the
# port hands off the full 0x80000000..0x280000000 span, so this is 0x200000000.
dram_size = "0x200000000"
skip_setup_tool = "scripts/seed-data-skip-setup.py"
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  # docs/guide/debugging.md: the device-tree panic region keeps the kernel from
  # dereferencing the board header's hardcoded peripheral address.
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  # docs/xnu/boot-arguments.md: diagnostic boot without AMFI enforcement, which is
  # what panics with "AMFI: No PMGR?" until this board has a PMGR provider.
  "amfi_get_out_of_my_way=1",
  # Kebab bdevsw route: bsd/dev/kona_ufs.c publishes ufsroot0 from the GPT
  # partition named by ufsroot and IOKitBSDInit's rd= hook selects it before
  # root-media matching. The iOS container lives on "userdata"; the APFS root
  # volume is selected by [payload.adt] root_match_volume_uuid.
  "rd=ufsroot0",
  "ufsroot=userdata",
]

# The trust cache the payload embeds is the static one from the 17.7.11 (21H461)
# restore image: Firmware/044-76040-038.dmg.trustcache, 59519 bytes, taken from
# out/ipsw/21H461. The OS profile allowlist covers other images, so this board states
# its own hash instead of accepting anything the image happens to carry.
trust_cache_sha256 = ["c9e50d678793ecaf8329ce022856c23c27775333181becb130c73ea93f376d17"]

[payload.adt]
# chip_id and owned_memory_size follow the OS profile and the SoC; the unique chip id
# is generated per board at payload time.
chip_id = "0x164"
owned_memory_size = "0x100000000"
unique_chip_id = "required"
# The 17.7.11 OS component (044-76040-038.dmg) carries one System-role volume with
# this UUID; the board's userdata image was built from the same component, so the
# mountroot selects it instead of the unsealed Data volume.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"

[bootimg]
# Measured: the ABL keeps the panel powered through cont_splash_region at 0x9c000000
# with size 0x2300000; the same values appear in dts/instantnoodlep.dts.
# dts/instantnoodlep.dts already declares /reserved-memory/splash_region at
# 0x9c000000 with size 0x2300000, so no dtb_node entry is needed here: bootimg creates
# such nodes with fdtput -c and fails with FDT_ERR_EXISTS when the node is present.
dtb_node = []

[device_tree]
source = "device:dts/instantnoodlep.dts"
include_dirs = ["soc:dts"]