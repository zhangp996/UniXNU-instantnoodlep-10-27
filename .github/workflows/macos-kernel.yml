name: macOS kernel build

# Builds the XNU kernel for this board on a GitHub macOS runner, because the kernel
# step calls Xcode. The upstream workflow lives in UniXNU/.github/workflows/macos.yml
# and is workflow_dispatch only, so another repository cannot call it.
on:
  workflow_dispatch:
    inputs:
      unixnu_repository:
        description: UniXNU repository as owner/name
        required: true
        default: UniXNU/UniXNU
      unixnu_ref:
        description: UniXNU ref
        required: true
        default: main
      soc_repository:
        description: SoC repository as owner/name
        required: true
        default: zhangp996/UniXNU-sm8250-common
      soc_ref:
        description: SoC repository ref
        required: true
        default: main
      device_repository:
        description: Device repository as owner/name (empty uses this repository)
        required: false
        default: ""
      defconfig:
        description: Defconfig name under device/configs
        required: true
        default: instantnoodlep_defconfig
      xcode:
        description: Xcode version of the macos-26 image
        required: true
        default: "26.6"
      fetch_ipsw:
        description: Download and extract the OS image on the runner before the build
        type: boolean
        default: true
      unique_chip_id:
        description: Platform seed for the payload (hex); not stored in any repository
        required: true
        default: "0x198110001A2B3C4D"

permissions:
  # read for the checkouts, write so a failing run can publish its logs to the
  # ci-logs branch instead of only to an artifact that needs a token to download
  contents: write

concurrency:
  group: macos-kernel-${{ github.ref }}-${{ inputs.defconfig }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
      DEFCONFIG: ${{ inputs.defconfig }}
      DEVICE_DIR: ${{ github.workspace }}/device
    steps:
      - name: Check out UniXNU at the workspace root
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.unixnu_repository }}
          ref: ${{ inputs.unixnu_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Check out the SoC repository beside the device repository
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.soc_repository }}
          ref: ${{ inputs.soc_ref }}
          path: UniXNU-sm8250-common
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.device_repository || github.repository }}
          path: device
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check the inputs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -f device/board.toml ] || fail 'device/board.toml is missing'
          [ -f "device/configs/$DEFCONFIG" ] || fail "device/configs/$DEFCONFIG is missing"
          [ -d "$DEVELOPER_DIR" ] || fail "Xcode not found at $DEVELOPER_DIR"
          [ -x ./unixnu ] || fail 'the UniXNU CLI is missing at the workspace root'
          if grep -q 'board.example = true' device/board.toml; then
            echo '::warning::board.example is true: the build will refuse to run'
          fi

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc lzfse
          if ! command -v unifdef >/dev/null; then brew install unifdef; echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"; fi

      - name: Register the board's local UFS component
        # components/kona-ufs is this board's ShengUfs fork. The component catalog lives
        # in the UniXNU checkout, so the entry the device repository records is appended
        # here before the configuration is resolved.
        run: |
          set -euo pipefail
          ENTRY="$DEVICE_DIR/components/kona-ufs/catalog-entry.toml"
          test -f "$ENTRY"
          if ! grep -q 'id = "KonaUfs"' components.toml; then
            printf '\n' >> components.toml
            cat "$ENTRY" >> components.toml
            echo "appended KonaUfs to components.toml"
          fi
          grep -n -A2 'id = "KonaUfs"' components.toml | head

      - name: Resolve the configuration
        run: |
          set -o pipefail
          ./unixnu defconfig "$DEFCONFIG" -D "$DEVICE_DIR" 2>&1 | tee "$RUNNER_TEMP/defconfig.log"
          ./unixnu status -D "$DEVICE_DIR" 2>&1 | tee "$RUNNER_TEMP/status.log"

      - name: Adapt the shared patch series
        # UniXNU's zzz-boot-progress.patch carries a hunk that only applies after the
        # sheng platform-power patch added a XNU_SHENG_PMGR block to bsd_init.c. This
        # board has no such block (it is not a sheng), so the hunk is dropped. Recorded
        # in the device repository's porting record.
        run: |
          python3 - <<'PY'
          import pathlib

          path = pathlib.Path("patches/xnu/zzz-boot-progress.patch")
          lines = path.read_text().split("\n")
          out, i, dropped = [], 0, 0
          while i < len(lines):
              line = lines[i]
              if line.startswith("@@ ") and "773,7 +775,9" in line:
                  i += 2
                  while i < len(lines) and not (
                      lines[i].startswith("@@ ")
                      or lines[i].startswith("--- a/")
                      or lines[i].startswith("diff --git")
                  ):
                      i += 1
                  dropped += 1
                  continue
              out.append(line)
              i += 1
          path.write_text("\n".join(out))
          print(f"dropped {dropped} hunk(s) from {path}")
          PY

      - name: Fetch sources
        run: |
          set -o pipefail
          ./unixnu fetch -D "$DEVICE_DIR" 2>&1 | tee "$RUNNER_TEMP/fetch.log"

      - name: Extract the OS image
        if: inputs.fetch_ipsw
        run: |
          set -o pipefail
          ./unixnu ipsw fetch -D "$DEVICE_DIR" 2>&1 | tee "$RUNNER_TEMP/ipsw.log"

      - name: Build the kernel
        run: |
          set -o pipefail
          ./unixnu build kernel -D "$DEVICE_DIR" 2>&1 | tee "$RUNNER_TEMP/kernel.log"

      - name: Build the payload
        run: |
          set -o pipefail
          # The static trust cache is the large one; the cryptex ones next to it are tiny.
          TRUST=$(ls -S out/ipsw/21H461/*.trustcache 2>/dev/null | head -1)
          echo "trust cache: ${TRUST:-none}"
          if [ -n "$TRUST" ]; then
            ./unixnu build payload -D "$DEVICE_DIR" --unique-chip-id "${{ inputs.unique_chip_id }}" --trust-cache "$TRUST" 2>&1 | tee "$RUNNER_TEMP/payload.log"
          else
            ./unixnu build payload -D "$DEVICE_DIR" --unique-chip-id "${{ inputs.unique_chip_id }}" 2>&1 | tee "$RUNNER_TEMP/payload.log"
          fi

      - name: Publish the build artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: boot-artifacts
          path: |
            out/**/kernel.macho
            out/**/payload/**
          if-no-files-found: warn

      - name: Report the failure
        if: failure()
        # Artifacts need a token to download, but annotations are readable through the
        # API, so a failing run states its interesting log lines in the check run itself.
        run: |
          set +e
          for f in "$RUNNER_TEMP"/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f") errors"
            grep -n -E 'error:|Error |ERROR|FAILED|fatal|undefined|not found|invalid|missing|required|cannot|unable|no such' "$f" | tail -n 12 | cut -c1-380 | while IFS= read -r line; do echo "::error::$line"; done
            echo "::endgroup::"
          done
          for log in payload kernel; do
            echo "::group::$log.log tail"
            tail -n 8 "$RUNNER_TEMP/$log.log" 2>/dev/null | cut -c1-380 | while IFS= read -r line; do echo "::error::$log tail: $line"; done
            echo "::endgroup::"
          done
          echo "::group::artifacts on disk"
          ls -l out/**/kernel.macho 2>/dev/null | cut -c1-300 | while IFS= read -r line; do echo "::error::$line"; done
          echo "::endgroup::"
          exit 0

      - name: Publish the logs to the ci-logs branch
        # An artifact needs an authenticated download; a branch does not. Diagnostics
        # are public build output, never secrets.
        if: failure()
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs"
          git init -q .
          git checkout -q --orphan ci-logs
          cp "$RUNNER_TEMP"/*.log . 2>/dev/null || true
          cat > MANIFEST.txt <<EOF
          run: ${{ github.run_id }}
          sha: ${{ github.sha }}
          job: ${{ github.job }}
          conclusion: failure
          built: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git add -A
          git -c user.name=ci -c user.email=ci@invalid commit -q -m "logs for run ${{ github.run_id }} (${{ github.sha }})"
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs --force
          echo "published to the ci-logs branch"

      - name: Publish logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: kernel-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: warn
