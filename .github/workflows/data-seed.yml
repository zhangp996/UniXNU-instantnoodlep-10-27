name: Data seed

# Builds only the macOS-only input this port still needs: the writable APFS Data seed taken from
# the OS volume's initial /private/var. The kernel build needs the KonaUfs catalogue entry that
# lives in this port's UniXNU fork, which the runner cannot read, so this workflow deliberately
# stops after the seed and publishes it.
on:
  workflow_dispatch:
    inputs:
      unixnu_repository:
        description: UniXNU repository as owner/name
        required: true
        default: unixnu/UniXNU
      unixnu_ref:
        description: UniXNU ref
        required: true
        default: main
      device_repository:
        description: Device repository as owner/name (empty uses this repository)
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  seed:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVICE_DIR: ${{ github.workspace }}/device
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out UniXNU at the workspace root
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.unixnu_repository }}
          ref: ${{ inputs.unixnu_ref }}
          submodules: false
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.device_repository || github.repository }}
          path: device
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install host tools
        run: brew install lzfse

      - name: Fetch the SoC feed
        run: |
          set -o pipefail
          ./unixnu fetch sm8250 -D "$DEVICE_DIR" 2>&1 | tee "$RUNNER_TEMP/fetch.log" || true

      - name: Fetch the OS member of the IPSW
        run: |
          set -o pipefail
          ./unixnu fetch sm8250 -D "$DEVICE_DIR" 2>&1 | tee -a "$RUNNER_TEMP/fetch.log" || true
          ./unixnu ipsw fetch -D "$DEVICE_DIR" 2>&1 | tee "$RUNNER_TEMP/ipsw.log" || true
          ./unixnu ipsw fetch OS -D "$DEVICE_DIR" 2>&1 | tee "$RUNNER_TEMP/os.log"
          ls -l out/ipsw/*/*.dmg | tee "$RUNNER_TEMP/dmgs.log"

      - name: Prepare the Data seed
        run: |
          set -o pipefail
          OSDMG=$(ls -S out/ipsw/*/*.dmg | head -1)
          echo "OSDMG=$OSDMG"
          MP="$PWD/.cache/firmware/target-volumes/os-mount"
          mkdir -p "$MP"
          hdiutil attach "$OSDMG" -nobrowse -owners off -mountpoint "$MP" 2>&1 | tee "$RUNNER_TEMP/attach.log"
          python3 scripts/prepare-owner-data-fixture.py 2>&1 | tee "$RUNNER_TEMP/seed.log"
          hdiutil detach "$MP" 2>&1 || true
          ls -l build/owner-data-fixture/ | tee -a "$RUNNER_TEMP/seed.log"

      - name: Give the seed the IPSW ownership and disable the failing services
        # The fixture image is created with ownership ignored, so every file in it reads as the
        # runner's uid and launchd, which runs as root, ignores the disabled database written there.
        # Keep the upstream image exactly as it is, mount it with owners honoured, and copy each
        # path's uid/gid from the OS volume's own /private/var before writing the database as root.
        run: |
          set -o pipefail
          SEED="$PWD/build/owner-data-fixture/owner-data-32.cdr"
          OSDMG=$(ls -S out/ipsw/*/*.dmg | head -1)
          OSMP="$RUNNER_TEMP/os-mount"
          SEEDMP="$RUNNER_TEMP/seed-mount"
          mkdir -p "$OSMP" "$SEEDMP"
          cat > "$RUNNER_TEMP/disabled.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.watchdogd</key>
            <true/>
          </dict>
          </plist>
          PLIST
          sudo hdiutil attach "$OSDMG" -nobrowse -mountpoint "$OSMP" -owners on 2>&1 | tee "$RUNNER_TEMP/os-attach.log"
          sudo hdiutil attach "$SEED" -nobrowse -mountpoint "$SEEDMP" -owners on 2>&1 | tee "$RUNNER_TEMP/seed-attach.log"
          sudo python3 - "$OSMP/private/var" "$SEEDMP" <<'PY'
          import os, sys
          src_root, dst_root = sys.argv[1], sys.argv[2]
          skip = {'staged_system_apps'}
          applied = 0
          for dirpath, dirnames, filenames in os.walk(src_root):
              rel = os.path.relpath(dirpath, src_root)
              if rel == '.':
                  dirnames[:] = [d for d in dirnames if d not in skip]
              for name in list(dirnames) + filenames:
                  src = os.path.join(dirpath, name)
                  dst = os.path.join(dst_root, os.path.normpath(os.path.join(rel, name)))
                  if not os.path.lexists(dst):
                      continue
                  st = os.lstat(src)
                  try:
                      os.lchown(dst, st.st_uid, st.st_gid)
                      applied += 1
                  except OSError:
                      pass
          print('ownership entries applied:', applied)
          PY
          sudo mkdir -p "$SEEDMP/db/com.apple.xpc.launchd"
          sudo cp "$RUNNER_TEMP/disabled.plist" "$SEEDMP/db/com.apple.xpc.launchd/disabled.plist"
          sudo cp "$RUNNER_TEMP/disabled.plist" "$SEEDMP/db/com.apple.xpc.launchd/disabled.501.plist"
          sudo chown -R 0:0 "$SEEDMP/db/com.apple.xpc.launchd"
          sudo chmod 644 "$SEEDMP/db/com.apple.xpc.launchd/disabled.plist"
          echo "== ownership:" | tee "$RUNNER_TEMP/seed-owners.log"
          ls -ln "$SEEDMP" | tee -a "$RUNNER_TEMP/seed-owners.log"
          ls -ln "$SEEDMP/db/com.apple.xpc.launchd" | tee -a "$RUNNER_TEMP/seed-owners.log"
          sudo hdiutil detach "$SEEDMP"
          sudo hdiutil detach "$OSMP" || true
          ls -l build/owner-data-fixture/


      - name: Publish the seed
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: data-seed
          path: |
            build/owner-data-fixture/**
            ${{ runner.temp }}/*.log
          if-no-files-found: warn
